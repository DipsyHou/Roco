[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "roco"
version = "1.0.0"
description = "Roco timeline-based spirit battle — desktop and online"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
online = ["websockets>=12.0"]
test = ["pytest>=8.0"]

[project.scripts]
roco-desktop = "roco.apps.desktop.game:main"
roco-online-desktop = "roco.apps.online.desktop:main"
roco-online-server = "roco.server.server_app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["roco*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
